[project]
name = "dbazar-backend"
version = "0.1.0"
description = "DBazar B2B/B2B2C Supply Chain, VMI Telemetry & Offline-First Cloud POS Backend"
readme = "AGENTS.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "pydantic>=2.9.0",
    "psycopg>=3.2.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-v --tb=short"
pythonpath = ["."]
