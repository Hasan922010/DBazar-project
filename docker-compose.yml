name: dbazar

services:
  postgres:
    image: postgres:16-alpine
    container_name: dbazar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbazar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbazar}
      POSTGRES_DB: ${POSTGRES_DB:-dbazar_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbazar -d dbazar_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dbazar-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: dbazar-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:9092
      - --smp 1
      - --memory 512M
      - --mode dev-container
    ports:
      - "9092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: dbazar-clickhouse
    environment:
      CLICKHOUSE_DB: dbazar_telemetry
      CLICKHOUSE_USER: dbazar
      CLICKHOUSE_PASSWORD: dbazar_ch_pass
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: dbazar-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dbazar_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dbazar_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  minio_data:
